<style>

/* fixed identity bar */
.idbar{position:fixed; left:0; right:0; bottom:0; z-index:40;

/* toast */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:60;

footer{margin-top:34px; padding-top:15px; border-top:1px solid var(--rule); font-size:12px; color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>

  {id:"r06", team:"보고서집필반", no:"06", title:"Ⅰ 검토배경 · Ⅱ 현황", due:"10.10",
   d:"왜 지금 이 문제인가를 중요성·시급성 관점에서. 정책 개요와 추진경위까지."},
  {id:"r07", team:"보고서집필반", no:"07", title:"Ⅱ 문제점", due:"10.10",

   d:"시간별 이동계획 실측, 숙소 예약(상한 서울 10만·광역시 8만·그 밖 7만), 비상연락망."},

var TEAMS = ["연구조사반","보고서집필반","AI·편집반","현장운영반"];

/* ─────────── 상태 ─────────── */
var API = (CONFIG.API_URL || "").trim();
var HAS_API = /^https:\/\//.test(API);
var LS = { me:"t7.me", local:"t7.local" };
var me = load(LS.me) || null;
var rows = [];              // {id, roleId, name, gb, status}
var filter = "all";
var isAdmin = false;
var timer = null, busy = false;

try{
  var q = new URLSearchParams(location.search);
  if (q.get("admin") && q.get("admin") === CONFIG.ADMIN_CODE) isAdmin = true;
}catch(e){}

function load(k){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ─────────── 통신 ─────────── */
function setLive(state, text){
  var d = document.getElementById("dot");
  d.className = "dot-live" + (state === "ok" ? "" : state === "err" ? " err" : " off");
  document.getElementById("livetxt").textContent = text;
}

function pull(){
  if (!HAS_API){ rows = load(LS.local) || []; render(); return Promise.resolve(); }
  return fetch(API + "?t=" + Date.now(), { method:"GET" })
    .then(function(r){ return r.json(); })
    .then(function(j){
      rows = (j && j.rows) || [];
      setLive("ok", "실시간 " + hhmm());
      render();
    })
    .catch(function(){
      setLive("err", "연결 끊김");
    });
}

function push(action, payload){
  if (!HAS_API){
    applyLocal(action, payload);
    save(LS.local, rows);
    render();
    return Promise.resolve();
  }
  if (busy) return Promise.resolve();
  busy = true;
  // Content-Type을 지정하지 않아야 preflight 없이 Apps Script로 전달됩니다.
  return fetch(API, { method:"POST", body: JSON.stringify({ action:action, payload:payload }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      busy = false;
      if (j && j.rows){ rows = j.rows; setLive("ok","실시간 " + hhmm()); render(); }
      else { return pull(); }
    })
    .catch(function(){ busy = false; setLive("err","저장 실패"); toast("저장에 실패했습니다. 다시 시도해 주세요."); });
}

function applyLocal(action, p){
  if (action === "add"){ rows.push({ id: uid(), roleId:p.roleId, name:p.name, gb:p.gb, status:"want" }); }
  else if (action === "remove"){ rows = rows.filter(function(r){ return r.id !== p.id; }); }
  else if (action === "confirm"){ rows.forEach(function(r){ if (r.id === p.id) r.status = "conf"; }); }
  else if (action === "unconfirm"){ rows.forEach(function(r){ if (r.id === p.id) r.status = "want"; }); }
}

function hhmm(){
  var d = new Date(), p = function(n){ return (n<10?"0":"") + n; };
  return p(d.getHours()) + ":" + p(d.getMinutes());
}

/* ─────────── 렌더 ─────────── */
function byRole(id){ return rows.filter(function(r){ return r.roleId === id; }); }
function isMine(r){ return me && r.name === me.name && String(r.gb) === String(me.gb); }

function render(){
  // 요약
  var conf = 0, want = 0, none = 0;
  ROLES.forEach(function(role){
    var list = byRole(role.id);
    if (list.some(function(r){ return r.status === "conf"; })) conf++;
    else if (list.length) want++;
    else none++;
  });
  document.getElementById("s-conf").textContent = conf;
  document.getElementById("s-want").textContent = want;
  document.getElementById("s-none").textContent = none;
  var t = ROLES.length;
  document.getElementById("bar-f").style.width = (conf / t * 100) + "%";
  document.getElementById("bar-p").style.width = (want / t * 100) + "%";

  // 내 현황
  var mewho = document.getElementById("mewho");
  var mine = document.getElementById("mine");
  if (me){
    mewho.innerHTML = "<b>" + esc(me.name) + "</b> · 교번 " + esc(me.gb);
    var my = rows.filter(isMine);
    if (my.length){
      mine.innerHTML = my.map(function(r){
        var role = ROLES.filter(function(x){ return x.id === r.roleId; })[0];
        return '<span class="minechip">' + (role ? esc(role.no + " " + role.title) : esc(r.roleId)) +
               (r.status === "conf" ? " ✓" : "") + "</span>";
      }).join("");
    } else {
      mine.innerHTML = '<span class="minechip none">아직 신청한 역할이 없습니다</span>';
    }
  } else {
    mewho.textContent = "아래에 이름과 교번을 입력하면 신청할 수 있습니다.";
    mine.innerHTML = "";
  }

  // 보드
  var board = document.getElementById("board");
  var html = "";
  TEAMS.forEach(function(team){
    var list = ROLES.filter(function(r){ return r.team === team; }).filter(passFilter);
    if (!list.length) return;
    var teamAll = ROLES.filter(function(r){ return r.team === team; });
    var teamConf = teamAll.filter(function(r){
      return byRole(r.id).some(function(x){ return x.status === "conf"; }); }).length;
    html += '<section class="team"><div class="team-h"><h2>' + esc(team) + "</h2>" +
            "<span>" + teamConf + " / " + teamAll.length + " 확정</span></div>";
    list.forEach(function(role){ html += roleCard(role); });
    html += "</section>";
  });
  if (!html) html = '<section class="team"><p style="color:var(--muted);font-size:13.5px">조건에 맞는 역할이 없습니다.</p></section>';
  board.innerHTML = html;
}

function passFilter(role){
  if (filter === "all") return true;
  var list = byRole(role.id);
  if (filter === "open") return list.length === 0;
  if (filter === "mine") return list.some(isMine);
  return true;
}

function roleCard(role){
  var list = byRole(role.id);
  var hasConf = list.some(function(r){ return r.status === "conf"; });
  var cls = hasConf ? "filled" : (list.length ? "pending" : "empty");
  var mineHere = list.filter(isMine)[0];

  var people = list.length
    ? list.map(function(r){
        var can = isAdmin || isMine(r);
        return '<span class="person ' + (r.status === "conf" ? "conf" : "want") + '">' +
               esc(r.name) + (r.status === "conf" ? " ✓" : "") +
               (can ? '<span class="x" data-act="remove" data-id="' + esc(r.id) + '" title="취소">×</span>' : "") +
               "</span>";
      }).join("")
    : '<span class="nobody">아직 아무도 없습니다</span>';

  var acts = "";
  if (mineHere){
    acts += '<button class="btn warn" data-act="remove" data-id="' + esc(mineHere.id) + '">신청 취소</button>';
  } else {
    acts += '<button class="btn pri" data-act="add" data-role="' + esc(role.id) + '"' + (me ? "" : " disabled") + '>이 역할 신청</button>';
  }
  if (isAdmin && list.length){
    list.forEach(function(r){
      acts += '<button class="btn" data-act="' + (r.status === "conf" ? "unconfirm" : "confirm") + '" data-id="' + esc(r.id) + '">' +
              esc(r.name) + (r.status === "conf" ? " 확정해제" : " 확정") + "</button>";
    });
  }

  return '<article class="rolecard ' + cls + '">' +
    '<div class="rc-top"><span class="rc-no">' + esc(role.no) + "</span>" +
    '<span class="rc-due">~' + esc(role.due) + "</span></div>" +
    "<h3>" + esc(role.title) + "</h3>" +
    '<p class="d">' + esc(role.d) + "</p>" +
    '<div class="people">' + people + "</div>" +
    '<div class="acts">' + acts + "</div>" +
    "</article>";
}

/* ─────────── 토스트 ─────────── */
var toastEl = null, toastT = null;
function toast(msg){
  if (!toastEl){ toastEl = document.createElement("div"); toastEl.className = "toast"; document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600);
}

/* ─────────── 이벤트 ─────────── */
document.getElementById("board").addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act");
  if (act === "add"){
    if (!me){ toast("먼저 아래에 이름과 교번을 입력해 주세요."); return; }
    push("add", { roleId: b.getAttribute("data-role"), name: me.name, gb: me.gb });
    toast("신청했습니다.");
  } else if (act === "remove"){
    push("remove", { id: b.getAttribute("data-id") });
  } else if (act === "confirm" || act === "unconfirm"){
    push(act, { id: b.getAttribute("data-id") });
  }
});

Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){
  c.addEventListener("click", function(){
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(x){
      x.setAttribute("aria-pressed", String(x === c));
    });
    filter = c.getAttribute("data-f");
    render();
  });
});

document.getElementById("btn-save").addEventListener("click", function(){
  var n = document.getElementById("in-name").value.trim();
  var g = document.getElementById("in-gb").value.trim();
  if (!n){ toast("이름을 입력해 주세요."); return; }
  me = { name:n, gb:g };
  save(LS.me, me);
  toast("저장했습니다. 이제 역할을 신청할 수 있습니다.");
  render();
});
document.getElementById("btn-refresh").addEventListener("click", function(){ pull(); });

document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible") pull();
});

/* ─────────── 시작 ─────────── */
if (me){
  document.getElementById("in-name").value = me.name;
  document.getElementById("in-gb").value = me.gb || "";
}
if (isAdmin){
  document.getElementById("adminnote").hidden = false;
  document.getElementById("subline").textContent = "제191기 · 관리자 모드";
}
if (!HAS_API){
  var b = document.getElementById("banner");
  b.hidden = false;
  b.innerHTML = "<b>혼자 보기 모드입니다.</b> 지금은 신청 내용이 내 휴대폰에만 저장되고 다른 조원에게는 보이지 않습니다. " +
                "index.html 맨 위 <code>API_URL</code>에 Apps Script 주소를 넣으면 실시간 공유로 바뀝니다.";
  setLive("off", "혼자 보기");
}
render();
pull();
if (HAS_API){
  timer = setInterval(function(){
    if (document.visibilityState === "visible") pull();
  }, Math.max(3, CONFIG.POLL_SECONDS) * 1000);
}
})();
